services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tribunal
      POSTGRES_USER: tribunal
      POSTGRES_PASSWORD: tribunal
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribunal"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes: ["tribunal_pg:/var/lib/postgresql/data"]
volumes:
  tribunal_pg:
